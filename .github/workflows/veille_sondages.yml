
name: Veille sondages présidentielle 2027
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: write
jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/veille_sondages.py
      - name: Commit des nouveaux signaux
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sondages_detectes.csv metadonnees_application.csv
          git diff --cached --quiet || git commit -m "Veille hebdo sondages"
          git push
